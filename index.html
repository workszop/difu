<style>
/* ─── edulab tokens (edustyl tokens/colors_and_type.css) ─── */
:root {
  --font-display: 'Outfit', 'IBM Plex Sans', system-ui, sans-serif;
  --font-sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --font-mono: 'Roboto Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --paper: #FFFFFF; --paper-2: #F5F3F0; --paper-3: #EAE6E0; --surface: #FFFFFF;
  --ink: #1C1917; --ink-2: #44403C; --ink-3: #625B53;
  --line: #E0DBD3; --line-2: #C9C2B7; --line-strong: #857C69;
  --yellow: #FFD500; --yellow-600: #F0C800; --yellow-soft: #FFD500; --yellow-ink: #1C1917;
  --blue: #1E8FC2; --blue-600: #177AA8; --blue-soft: #177AA8; --blue-ink: #FFFFFF;
  --green: #00A651; --green-600: #078342; --green-soft: #078342; --green-ink: #FFFFFF;
  --red: #E5322D; --red-600: #C92823; --red-soft: #C92823; --red-ink: #FFFFFF;
  --grape: #7A5AC2; --grape-soft: #7A5AC2; --grape-ink: #FFFFFF;
  --primary: var(--yellow); --on-primary: #1C1917;
  --focus-ring: 0 0 0 2px var(--paper), 0 0 0 5px var(--ink);
  --track: color-mix(in srgb, var(--ink) 24%, transparent);
  --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-pill: 999px;
  --shadow-sm: 0 1px 2px rgba(33,30,26,.10), 0 2px 6px rgba(33,30,26,.06);
  --shadow-md: 0 6px 18px rgba(33,30,26,.12), 0 1px 3px rgba(33,30,26,.08);
  --shadow-primary: 0 8px 22px color-mix(in srgb, var(--yellow) 30%, transparent);
  --gutter: max(clamp(16px, 4vw, 72px), min(15vw, calc((100vw - 900px) / 2)));  /* ~15% margins on wide screens, content never squeezed below 900px */
  --overline: 12px;
}

/* ─── base ─── */
* { box-sizing: border-box; }
html { scroll-padding-top: 90px; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-sans); font-size: 16px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--font-display); color: var(--ink); margin: 0; }
p { margin: 0; color: var(--ink-2); line-height: 1.55; }
a { color: var(--blue-600); }
button { font: inherit; }
:focus-visible { outline: 3px solid transparent; outline-offset: 2px; box-shadow: var(--focus-ring); }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ov { font-family: var(--font-mono); font-weight: 500; font-size: var(--overline); letter-spacing: .12em; text-transform: uppercase; color: var(--ink); }
.ic { width: 20px; height: 20px; flex: none; }

/* ─── header ─── */
.edu-header { position: sticky; top: 0; z-index: 20; background: var(--paper); border-bottom: 1px solid var(--line-2); }
.edu-header-inner { padding: 6px var(--gutter); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.edu-logo { width: 56px; height: 56px; display: block; margin-right: -6px; }
.edu-wordmark { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -.02em; color: var(--ink); }
.spacer { flex: 1; }
.progress { position: absolute; left: 0; bottom: -1px; height: 4px; background: var(--yellow); width: 0; transition: width .2s; }

/* segmented toggle: stone track, each option a full pill, active solid yellow */
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; background: var(--paper-2); border-radius: var(--r-pill); }
.seg button { border: none; background: transparent; padding: 8px 14px; border-radius: var(--r-pill); font-weight: 600; font-size: 15px; color: var(--ink-2); cursor: pointer; transition: background-color .15s; }
.seg button:hover:not(:disabled):not(.active) { background: var(--paper-3); }
.seg button.active { background: var(--yellow); color: var(--yellow-ink); }

/* ─── page head + sections ─── */
.page-head { padding: 24px var(--gutter) 26px; }
.app-title { font-weight: 800; font-size: clamp(2.1rem, 4.6vw, 3.2rem); letter-spacing: -.025em; line-height: 1.05; margin: 0 0 12px; }
.lead { font-size: 1.15rem; line-height: 1.55; color: var(--ink-2); }
.sec { padding: 26px var(--gutter) 40px; border-top: 1px solid var(--line); }
.sec.stone { background: var(--paper-2); }
.sec-head { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
.sec-head h2 { font-size: 28px; line-height: 1.15; }
.sec-head::after { content: ""; flex: 1; height: 1px; background: var(--line-2); }
.badge { flex: none; width: 34px; height: 34px; border-radius: var(--r-sm); display: inline-grid; place-items: center; background: var(--ink); color: var(--yellow); }
.badge-lg { width: 46px; height: 46px; border-radius: var(--r-md); }
.badge-lg .ic { width: 24px; height: 24px; }
.tone-grape { background: var(--grape-soft); color: var(--grape-ink); }
.tone-blue { background: var(--blue-soft); color: var(--blue-ink); }
.tone-yellow { background: var(--yellow-soft); color: var(--yellow-ink); }
.tone-green { background: var(--green-soft); color: var(--green-ink); }

/* card anatomy */
.card { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.card-head { padding: 12px 18px; background: var(--paper-2); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.card-head h3 { font-size: 19px; line-height: 1.25; }
.tile-h { display: flex; align-items: center; gap: 10px; min-width: 0; }
.card-body { padding: 18px; flex: 1; }
.card-foot { padding: 12px 18px; border-top: 1px dashed var(--line-2); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* buttons */
.btn { font-family: var(--font-display); font-weight: 600; font-size: 17px; background: var(--yellow); color: var(--on-primary); border: none; border-radius: var(--r-pill); padding: 11px 22px; cursor: pointer; box-shadow: var(--shadow-primary); transition: background-color .15s, transform .12s; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { background: var(--yellow-600); }
.btn:active { transform: scale(.96); }
.btn-ghost { font-family: var(--font-display); font-weight: 600; font-size: 15px; background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); border-radius: var(--r-pill); padding: 9px 16px; cursor: pointer; transition: background-color .15s; }
.btn-ghost:hover { background: var(--paper-2); }
.btn:disabled, .btn-ghost:disabled { opacity: .5; cursor: not-allowed; }
kbd { font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--line-strong); border-radius: var(--r-xs); padding: 1px 6px; background: var(--surface); color: var(--ink); }

/* ─── generator (layout B "taśma kroków") ─── */
.bar { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; margin-bottom: 18px; }
.grp { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
/* image height ≈ viewport minus the chrome above and the strip below, so a projector shows everything at once */
.stage { display: grid; grid-template-columns: minmax(0, 1fr) 200px minmax(0, 1fr); gap: 24px; align-items: center; max-width: max(800px, calc(2 * (100vh - 590px) + 248px)); margin: 0 auto; }
.stage figure { margin: 0; min-width: 0; }
.stage figcaption { display: flex; flex-direction: column; gap: 2px; margin-bottom: 10px; min-width: 0; min-height: 4.4em; }
.stage figcaption b { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--ink); line-height: 1.2; }
.stage figcaption span { font-size: 15px; line-height: 1.4; color: var(--ink-2); }
.frame { position: relative; aspect-ratio: 1; border-radius: var(--r-md); overflow: hidden; background: var(--paper-3); border: 1px solid var(--line-2); }
.frame img { width: 100%; height: 100%; display: block; object-fit: cover; image-rendering: pixelated; }
.frame .empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; font-family: var(--font-display); font-size: 20px; font-weight: 600; color: var(--ink-2); }
.mid { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.big { font-family: var(--font-display); font-weight: 700; font-size: clamp(40px, 4.4vw, 60px); line-height: 1; letter-spacing: -.02em; color: var(--ink); font-variant-numeric: tabular-nums; }
.meter { width: 100%; height: 10px; border-radius: var(--r-pill); background: var(--paper-3); overflow: hidden; margin: 6px 0 10px; }
.meter span { display: block; height: 100%; background: var(--ink); border-radius: var(--r-pill); transition: width .15s; }
.arrow { font: 700 34px var(--font-display); color: var(--ink-3); margin: 6px 0 10px; }
.scrub { max-width: max(800px, calc(2 * (100vh - 590px) + 248px)); margin: 12px auto 0; display: flex; align-items: center; gap: 14px; }
.scrub input { flex: 1; }
input[type=range] { accent-color: var(--ink); width: 100%; height: 28px; cursor: pointer; }
.strip { display: flex; gap: 4px; overflow-x: auto; padding: 8px 2px 6px; max-width: max(800px, calc(2 * (100vh - 590px) + 248px)); margin: 0 auto; }
.thumb { flex: 1 0 26px; max-width: 64px; padding: 0; border: 2px solid transparent; border-radius: 8px; background: none; cursor: pointer; line-height: 0; }
.thumb img { width: 100%; aspect-ratio: 1; border-radius: 6px; display: block; background: var(--paper-3); }
.thumb.active { border-color: var(--ink); }
.ahas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 22px; }
.aha { border: 1px solid var(--line-2); border-radius: var(--r-md); padding: 14px 16px; background: var(--surface); display: flex; gap: 12px; align-items: center; transition: background-color .2s; }
.aha p { color: var(--ink); font-size: 17px; }
.aha.on { background: var(--yellow); border-color: var(--yellow); }
.aha.on p { color: var(--yellow-ink); }
.hint { margin-top: 14px; font-size: 14px; color: var(--ink-3); }

/* ─── training ─── */
.story { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.story .frame { margin-bottom: 12px; }
.story canvas { width: 100%; height: 100%; display: block; }
.caption-quote { font-family: var(--font-display); font-size: 21px; font-weight: 600; color: var(--ink); line-height: 1.3; }
.readline { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.readline .big { font-size: 34px; }
.table-card { padding: 0; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { text-align: left; padding: 12px 16px; background: var(--paper-3); border-bottom: 1px solid var(--line-2); font-family: var(--font-mono); font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--ink); }
td { padding: 12px 16px; border-bottom: 1px solid var(--line); color: var(--ink-2); vertical-align: top; }
tbody tr:nth-child(even) td { background: var(--paper-2); }
tbody tr:last-child td { border-bottom: none; }
td:first-child { color: var(--ink); font-weight: 600; }
td.big-cell { font-family: var(--font-display); font-weight: 700; font-size: 20px; color: var(--ink); }
sup a { font-family: var(--font-mono); font-size: 11px; text-decoration: none; }
.sources { margin-top: 14px; font-size: 14px; }
.sources li { margin-bottom: 4px; color: var(--ink-2); }
details.more { margin-top: 20px; border: 1px solid var(--line-2); border-radius: var(--r-md); background: var(--surface); }
details.more summary { cursor: pointer; padding: 14px 18px; font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--ink); }
details.more .more-body { padding: 0 18px 18px; display: grid; gap: 10px; }
details.more p { max-width: 70rem; }

footer { padding: 26px var(--gutter) 40px; border-top: 1px solid var(--line-2); background: var(--paper-2); font-size: 14px; }
footer p { color: var(--ink-2); margin-bottom: 6px; }

@media (max-width: 1100px) { .story { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 768px) {
  .edu-logo { width: 44px; height: 44px; }
  .edu-wordmark { font-size: 19px; }
  .edu-header-inner { gap: 8px; }
  .seg button { padding: 7px 11px; font-size: 14px; }
  .page-head { padding: 20px var(--gutter) 22px; }
  .sec { padding: 24px var(--gutter) 32px; }
  .sec-head { flex-wrap: wrap; }
  .sec-head h2 { flex: 1; min-width: 0; font-size: 23px; }
  .sec-head::after { flex: 1 0 100%; }
  .stage { grid-template-columns: 1fr 1fr; gap: 10px; }
  .stage figcaption { min-height: 4.8em; }
  .stage figcaption b { font-size: 16px; }
  .stage figcaption span { font-size: 13px; }
  .mid { grid-column: 1 / -1; order: -1; flex-direction: row; flex-wrap: wrap; justify-content: space-between; text-align: left; gap: 8px 14px; }
  .mid .meter, .arrow { display: none; }
  .big { font-size: 34px; }
  .frame .empty { font-size: 15px; padding: 10px; }
  .ahas, .story { grid-template-columns: 1fr; }
  kbd, .kbd-hint { display: none; }
  table { font-size: 14px; }
  th, td { padding: 10px 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>

const exists = (p, s, g, n) => Boolean(caseById[caseId(p, s, g, n)]);
const currentCase = () => caseById[caseId(state.prompt, state.seed, state.guidance, state.steps)];
const framePath = (c, kind, k) => `${GEN_DIR}${c.id}/${kind}${String(k).padStart(2, '0')}.${DATA.format || 'webp'}`;
const noisePct = (c, k) => Math.round(100 * (1 - c.alphabar[k]));
function button(label, attrs = {}) {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = label;
  for (const [k, v] of Object.entries(attrs)) b.dataset[k] = v;
  return b;
}
const preloaded = new Set();
function preload(c) {
  if (preloaded.has(c.id)) return;
  preloaded.add(c.id);
  for (let k = 0; k <= c.steps; k++) {
    new Image().src = framePath(c, 'c', k);
    if (k) new Image().src = framePath(c, 'p', k);
  }
}

// picks a case that exists after one control changed, following the one-control-at-a-time rule
function resolve(changed) {
  const s0 = DATA.seeds[0], d = DATA.default_steps;
  if (changed === 'seed') { state.guidance = 'mid'; state.steps = d; }
  if (changed === 'guid') { state.seed = s0; state.steps = d; }
  if (changed === 'steps') { state.seed = s0; state.guidance = 'mid'; }
  if (!exists(state.prompt, state.seed, state.guidance, state.steps)) state.steps = d;
  if (!exists(state.prompt, state.seed, state.guidance, state.steps)) state.guidance = 'mid';
  if (!exists(state.prompt, state.seed, state.guidance, state.steps)) state.seed = s0;
}

// ─── Render: static text ────────────────────────
function renderText() {
  document.documentElement.lang = lang;
  $('#app').dataset.lang = lang;
  $$('[data-i18n]').forEach(n => { n.textContent = t(n.dataset.i18n); });
  $$('[data-i18n-aria]').forEach(n => n.setAttribute('aria-label', t(n.dataset.i18nAria)));
  $$('[data-lang]').forEach(b => { b.classList.toggle('active', b.dataset.lang === lang); b.setAttribute('aria-pressed', b.dataset.lang === lang); });
  document.title = `${t('genTitle')} – edulab`;
  el.footModel.textContent = t('footModel', DATA);
  buildControls();
}

function buildControls() {
  el.prompts.replaceChildren(...DATA.prompts.map(p => button(p[lang] ?? p.pl, { prompt: p.id })));
  el.seeds.replaceChildren(...DATA.seeds.map((s, i) => button(SEED_NAMES[i], { seed: s })));
  el.guids.replaceChildren(...GUID_KEYS.map(g => button(t('guid_' + g), { guid: g })));
  el.stepsSeg.replaceChildren(...STEP_OPTIONS.map(n => button(String(n), { steps: n })));
  renderGen();
}

// ─── Render: view switch ────────────────────────
function renderView() {
  el.gen.hidden = state.view !== 'gen';
  el.train.hidden = state.view !== 'train';
  $$('[data-tab]').forEach(b => { const on = b.dataset.tab === state.view; b.classList.toggle('active', on); b.setAttribute('aria-current', on ? 'page' : 'false'); });
  renderProgress();
}
function renderProgress() {
  let p = 0;
  if (state.view === 'gen') { const c = currentCase(); p = c ? state.step / c.steps : 0; }
  el.progress.style.width = (100 * p).toFixed(1) + '%';
}

// ─── Render: generator ──────────────────────────
function renderGen() {
  const c = currentCase();
  if (!c) return;
  const k = Math.max(0, Math.min(state.step, c.steps));
  state.step = k;
  const pct = noisePct(c, k);
  Object.assign(el.gen.dataset, { case: c.id, step: k, steps: c.steps, seed: state.seed, guidance: state.guidance, prompt: state.prompt, playing: state.playing, noise: pct });

  el.imgNow.src = framePath(c, 'c', k);
  el.imgNow.alt = `${t('now')}: ${t('live', k, c.steps, pct)}`;
  el.imgPred.hidden = k === 0;
  el.predEmpty.hidden = k !== 0;
  if (k) { el.imgPred.src = framePath(c, 'p', k); el.imgPred.alt = t('pred'); }
  el.rStep.textContent = `${k} / ${c.steps}`;
  el.rNoise.textContent = `${pct}%`;
  el.rMeter.style.width = pct + '%';
  el.play.textContent = `${state.playing ? ICONS.pause : ICONS.play} ${state.playing ? t('pause') : (k === c.steps ? t('replay') : t('play'))}`;
  el.play.setAttribute('aria-pressed', state.playing);
  el.scrub.max = c.steps; el.scrub.value = k;
  el.scrub.setAttribute('aria-valuetext', t('live', k, c.steps, pct));

  const hasSteps = s => exists(state.prompt, DATA.seeds[0], 'mid', s);
  $$('#prompts button').forEach(b => setActive(b, b.dataset.prompt === state.prompt));
  $$('#seeds button').forEach(b => setActive(b, +b.dataset.seed === state.seed));
  $$('#guids button').forEach(b => setActive(b, b.dataset.guid === state.guidance));
  $$('#stepsSeg button').forEach(b => {
    setActive(b, +b.dataset.steps === state.steps);
    b.hidden = !hasSteps(+b.dataset.steps);           // only prepared step counts are offered
  });
  el.grpSteps.hidden = STEP_OPTIONS.filter(hasSteps).length < 2;
  $$('.aha').forEach(a => a.classList.toggle('on', a.dataset.aha === state.lastControl));

  if (el.strip.dataset.case !== c.id) {
    el.strip.dataset.case = c.id;
    el.strip.replaceChildren(...Array.from({ length: c.steps + 1 }, (_, i) => {
      const b = button('', { k: i });
      b.className = 'thumb';
      b.setAttribute('aria-label', `${t('step')} ${i}`);
      const im = document.createElement('img');
      im.src = framePath(c, 'c', i); im.alt = ''; im.loading = 'lazy'; im.width = 64; im.height = 64;
      b.append(im);
      return b;
    }));
  }
  $$('.thumb').forEach(b => { const on = +b.dataset.k === k; b.classList.toggle('active', on); b.setAttribute('aria-current', on ? 'step' : 'false'); });
  renderProgress();
}
function setActive(b, on) { b.classList.toggle('active', on); b.setAttribute('aria-pressed', on); }

// ─── Playback ───────────────────────────────────
let playTimer = null;
function stop() { state.playing = false; clearTimeout(playTimer); playTimer = null; }
function play() {
  const c = currentCase();
  if (state.step >= c.steps) state.step = 0;
  if (reduceMotion) { state.step = c.steps; stop(); renderGen(); announce(); return; }
  state.playing = true;
  const ms = Math.max(90, Math.min(900, PLAY_MS / c.steps));
  const tick = () => {
    state.step++;
    if (state.step >= c.steps) { state.step = c.steps; stop(); announce(); }
    else playTimer = setTimeout(tick, ms);
    renderGen();
  };
  playTimer = setTimeout(tick, ms);
  renderGen();
}
function replay() { stop(); preload(currentCase()); state.step = 0; play(); }
function setStep(k) { stop(); state.step = k; renderGen(); announce(); }
function announce() { const c = currentCase(); el.genLive.textContent = t('live', state.step, c.steps, noisePct(c, state.step)); }

// ─── Forward process (training example) ─────────
const fwd = { ready: false, x0: null, eps: null };
function setupForward() {
  const img = new Image();
  img.onload = () => {
    const ctx = el.cvPhoto.getContext('2d');
    ctx.drawImage(img, 0, 0, 320, 320);
    const px = ctx.getImageData(0, 0, 320, 320).data;
    fwd.x0 = new Float32Array(320 * 320 * 3);
    fwd.eps = new Float32Array(320 * 320 * 3);
    const r = rng(2024);
    for (let i = 0, j = 0; i < px.length; i += 4) for (let ch = 0; ch < 3; ch++, j++) {
      fwd.x0[j] = px[i + ch] / 127.5 - 1;
      fwd.eps[j] = gaussian(r);
    }
    fwd.ready = true;
    paintNoiseTarget();
    renderForward();
  };
  img.src = window.PHOTO_CAT;
}
const fwdAlphaBar = tt => Math.cos(Math.PI / 2 * tt) ** 2;     // cosine schedule: t=0 clean, t=1 pure noise
function paint(canvas, fn) {
  const ctx = canvas.getContext('2d'), im = ctx.createImageData(320, 320), d = im.data;
  for (let i = 0, j = 0; i < d.length; i += 4) { for (let ch = 0; ch < 3; ch++, j++) d[i + ch] = fn(j); d[i + 3] = 255; }
  ctx.putImageData(im, 0, 0);
}
const to255 = v => Math.max(0, Math.min(255, (v + 1) * 127.5));
function paintNoiseTarget() { paint(el.cvNoise, j => to255(fwd.eps[j] * 0.5)); }
function renderForward() {
  const tt = state.fwdT, ab = fwdAlphaBar(tt), a = Math.sqrt(ab), b = Math.sqrt(1 - ab);
  const pct = Math.round(100 * (1 - ab));
  el.fwd.dataset.t = tt.toFixed(2); el.fwd.dataset.noise = pct;
  el.fwdT.textContent = tt.toFixed(2);
  el.fwdNoise.textContent = pct + '%';
  el.fwdSlider.value = Math.round(tt * 100);
  el.fwdSlider.setAttribute('aria-valuetext', `t = ${tt.toFixed(2)}, ${pct}%`);
  if (fwd.ready) paint(el.cvNoisy, j => to255(a * fwd.x0[j] + b * fwd.eps[j] * 0.5));
}

// ─── Event listeners ────────────────────────────
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.tab) { setView(d.tab); return; }
  if (d.lang) { lang = d.lang; try { localStorage.setItem('lang', lang); } catch (err) { /* ignore */ } renderText(); return; }
  // every settings change replays the whole run: from pure noise to the picture
  if (d.prompt) { state.prompt = d.prompt; resolve('prompt'); state.lastControl = null; replay(); return; }
  else if (d.seed) { state.seed = +d.seed; resolve('seed'); state.lastControl = 'seed'; replay(); return; }
  else if (d.guid) { state.guidance = d.guid; resolve('guid'); state.lastControl = 'guid'; replay(); return; }
  else if (d.steps) { state.steps = +d.steps; resolve('steps'); state.lastControl = 'steps'; replay(); return; }
  else if (b.classList.contains('thumb')) { setStep(+d.k); return; }
  else if (b === el.play) { state.playing ? stop() : play(); }
  else return;
  preload(currentCase());
  renderGen();
  if (!state.playing) announce();
});
el.scrub.addEventListener('input', () => setStep(+el.scrub.value));
el.fwdSlider.addEventListener('input', () => { state.fwdT = +el.fwdSlider.value / 100; renderForward(); });
document.addEventListener('keydown', e => {
  if (state.view !== 'gen' || e.altKey || e.ctrlKey || e.metaKey) return;
  const tag = e.target.tagName, onRange = e.target === el.scrub;
  if (tag === 'INPUT' && !onRange || tag === 'TEXTAREA' || tag === 'SELECT') return;
  const c = currentCase();
  if (e.key === ' ' && !(tag === 'BUTTON' && e.target !== el.play) && tag !== 'SUMMARY') {
    e.preventDefault();
    if (e.target === el.play) return;            // the button's own click handles it
    state.playing ? stop() : play(); renderGen(); return;
  }
  if (onRange) return;                          // the slider handles its own arrows
  const moves = { ArrowRight: 1, ArrowLeft: -1, Home: -Infinity, End: Infinity };
  if (e.key in moves) { e.preventDefault(); setStep(Math.max(0, Math.min(c.steps, state.step + moves[e.key]))); }
});
function setView(v) {
  state.view = v === 'train' ? 'train' : 'gen';
  if (state.view !== 'gen') stop();
  if (location.hash.slice(1) !== state.view) history.replaceState(null, '', '#' + state.view);
  renderView();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => setView(location.hash.slice(1)));

// ─── Init ───────────────────────────────────────
(function init() {
  if (reduceMotion) state.step = currentCase().steps;
  renderText();
  setView(location.hash.slice(1) || 'gen');
  preload(currentCase());
  renderForward();
  setupForward();
  announce();
  // ─── Reveal ───
  const FONT_WAIT_MS = 1500;
  const BRAND_FONTS = ['400 1em Outfit', '700 1em Outfit', '400 1em "IBM Plex Sans"', '600 1em "IBM Plex Sans"', '400 1em "Roboto Mono"'];
  Promise.race([
    Promise.all(BRAND_FONTS.map(f => document.fonts.load(f).catch(() => null))),
    new Promise(r => setTimeout(r, FONT_WAIT_MS)),
  ]).then(() => {
    document.documentElement.classList.add('app-ready');
  });
})();
</script>
</body>
</html>
